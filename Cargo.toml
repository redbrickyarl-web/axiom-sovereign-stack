[package]
name = "axiom-sovereign-stack"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
aethelarch = []

[dependencies]
crossbeam-queue = "0.3"
crossbeam-epoch = "0.9"
parking_lot = "0.12"
simd-json = "0.13"
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance_bench"
harness = false

[[bench]]
name = "aethelarch_gemv"
harness = false
required-features = ["aethelarch"]
